<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RufusChat UI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Projects sidebar">
        <div class="sidebar__header">
          <div>
            <div class="eyebrow">Projects</div>
            <h1>RufusChat</h1>
          </div>
          <button class="button button--ghost" id="new-project-button" type="button">New project</button>
        </div>

        <nav class="project-tree" aria-label="Projects list">
          <section class="project-group project-group--active">
            <button class="project-group__title" type="button" aria-expanded="true">PI Agent</button>
            <div class="project-group__children">
              <button class="chat-item chat-item--active" type="button" data-project="PI Agent" data-chat="Branch · RufusChat Fase 10">Branch · RufusChat Fase 10</button>
              <button class="chat-item" type="button" data-project="PI Agent" data-chat="RufusChat Fase 10">RufusChat Fase 10</button>
              <button class="chat-item" type="button" data-project="PI Agent" data-chat="RufusChat Fase 9">RufusChat Fase 9</button>
              <button class="chat-item" type="button" data-project="PI Agent" data-chat="Adjust · RufusChat UX">Adjust · RufusChat UX</button>
              <button class="chat-item" type="button" data-project="PI Agent" data-chat="RufusChat Fase 8">RufusChat Fase 8</button>
              <button class="chat-item chat-item--muted" type="button">Show more</button>
            </div>
          </section>

          <button class="project-link" type="button">CivilPlan</button>
          <button class="project-link" type="button">Wise</button>
          <button class="project-link" type="button">CC Analysis</button>
          <button class="project-link" type="button">Hermes WSL2</button>
        </nav>

        <div class="sidebar__footer">
          <span>RufusChat UI v0</span>
          <span>Provider: not connected</span>
          <span>RCK: background / not wired in 10A</span>
        </div>
      </aside>

      <main class="chat-pane" aria-label="Chat area">
        <header class="chat-header">
          <div>
            <div class="eyebrow">RufusChat</div>
            <div class="chat-header__meta">
              <span>current project: <strong id="current-project">PI Agent</strong></span>
              <span>current chat: <strong id="current-chat">Branch · RufusChat Fase 10</strong></span>
            </div>
          </div>
          <div class="chat-header__status">Local-first skeleton</div>
        </header>

        <section class="messages" id="messages" aria-live="polite" aria-label="Messages"></section>

        <form class="composer" id="composer-form">
          <label class="sr-only" for="composer-input">Ask RufusChat</label>
          <textarea id="composer-input" name="message" rows="1" placeholder="Ask RufusChat..." autocomplete="off" spellcheck="false"></textarea>
          <div class="composer__footer">
            <span class="composer__hint">Type / for commands</span>
            <button class="button button--primary" type="submit">Send</button>
          </div>
        </form>
      </main>
    </div>

    <div class="confirm-modal" id="confirm-modal" hidden>
      <div class="confirm-modal__backdrop" data-confirm-cancel></div>
      <section class="confirm-modal__panel" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-description">
        <div>
          <h2 id="confirm-modal-title">Confirm action</h2>
          <p id="confirm-modal-description"></p>
        </div>
        <div class="confirm-modal__actions">
          <button class="button button--ghost" type="button" id="confirm-modal-cancel">Cancel</button>
          <button class="button button--primary" type="button" id="confirm-modal-confirm">Confirm</button>
        </div>
      </section>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
