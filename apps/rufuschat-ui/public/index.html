<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RufusChat UI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Projects sidebar">
        <div class="sidebar__header">
          <div>
            <div class="eyebrow">RufusChat</div>
            <h1>Workspace</h1>
            <p class="sidebar__subtitle">Projects and chats</p>
          </div>
        </div>

        <section class="sidebar__section sidebar__section--actions" aria-label="Global actions">
          <div class="sidebar__section-label">Create</div>
          <div class="sidebar__actions">
            <button class="button button--ghost" id="new-project-button" type="button">New project</button>
            <button class="button button--ghost" id="new-chat-button" type="button">New chat</button>
          </div>
        </section>

        <div class="sidebar__tree-shell">
          <div class="sidebar__section-label">Projects</div>
          <nav class="project-tree" id="project-tree" aria-label="Projects list"></nav>
        </div>

        <div class="sidebar__dev-tools" aria-label="Local data tools">
          <div class="sidebar__dev-tools-label">Local data</div>
          <div class="sidebar__dev-tools-actions">
            <button class="button button--ghost button--compact" id="product-state-export-button" type="button">Export</button>
            <button class="button button--ghost button--compact" id="product-state-import-button" type="button">Import</button>
            <button class="button button--ghost button--compact button--destructive" id="product-state-reset-button" type="button">Reset</button>
          </div>
          <input id="product-state-import-input" type="file" accept="application/json,.json" hidden />
        </div>

        <div class="sidebar__footer">
          <span>Local data stays local</span>
        </div>
      </aside>

      <main class="chat-pane" aria-label="Chat area">
        <header class="chat-header">
          <div>
            <div class="eyebrow">RufusChat</div>
            <div class="chat-header__meta">
              <span>active project: <strong id="current-project">PI Agent</strong></span>
              <span>active chat: <strong id="current-chat">Branch · RufusChat Fase 10</strong></span>
            </div>
            <div class="chat-session-shell" aria-label="Chat session memory state">
              <span>Memory: <strong id="current-memory-status">not connected</strong></span>
              <span>Summary: <strong id="current-summary-status">not generated</strong></span>
              <span class="chat-session-shell__trace">
                <span>RCK trace: <strong id="current-rck-trace-status">not linked</strong></span>
                <button class="chat-session-shell__chip" id="current-trace-chip" type="button">Trace: not linked</button>
              </span>
            </div>
          </div>
          <div class="chat-header__status">Browser-local session</div>
        </header>

        <section class="messages" id="messages" aria-live="polite" aria-label="Messages">
          <div class="messages__inner" id="messages-inner"></div>
        </section>

        <div class="slash-menu" id="slash-menu" hidden aria-label="Slash commands"></div>

        <form class="composer" id="composer-form">
          <label class="sr-only" for="composer-input">Ask RufusChat</label>
          <textarea id="composer-input" name="message" rows="1" placeholder="Ask RufusChat..." autocomplete="off" spellcheck="false"></textarea>
          <div class="composer__footer">
            <span class="composer__hint">Type / for commands</span>
            <button class="button button--primary" type="submit" aria-label="Send message">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 18V6" />
                <path d="M7.5 10.5 12 6l4.5 4.5" />
              </svg>
              <span class="sr-only">Send</span>
            </button>
          </div>
        </form>
      </main>
    </div>

    <div class="context-menu" id="project-context-menu" hidden aria-label="Project actions"></div>
    <div class="context-menu" id="chat-context-menu" hidden aria-label="Chat actions"></div>

    <div class="confirm-modal" id="confirm-modal" hidden>
      <div class="confirm-modal__backdrop" data-confirm-cancel></div>
      <section class="confirm-modal__panel" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-description">
        <div>
          <h2 id="confirm-modal-title">Confirm action</h2>
          <p id="confirm-modal-description"></p>
        </div>
        <div class="confirm-modal__actions">
          <button class="button button--ghost" type="button" id="confirm-modal-cancel">Cancel</button>
          <button class="button button--primary" type="button" id="confirm-modal-confirm">Confirm</button>
        </div>
      </section>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
